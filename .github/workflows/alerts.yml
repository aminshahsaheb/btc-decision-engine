name: alerts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status = send the timeframe table once; run = detect events, send, log"
        type: choice
        options:
          - status
          - run
        default: status
concurrency:
  group: alerts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the log branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          git config --global user.name "alert-bot"
          git config --global user.email "alert-bot@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" alert-log >/dev/null 2>&1; then
            git clone -q --branch alert-log "$URL" log
          else
            mkdir log
            git -C log init -q -b alert-log
            git -C log remote add origin "$URL"
          fi
      - name: Run the alert script
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/alerts.py "${{ inputs.mode || 'run' }}" --log log/alerts.csv
      - name: Save the log
        if: ${{ always() }}
        run: |
          cd log
          git add -A
          if git diff --cached --quiet; then echo "no new alerts"; else git commit -q -m "alerts $(date -u +%FT%TZ)" && git push -q origin alert-log; fi
